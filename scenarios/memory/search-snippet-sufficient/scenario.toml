id = "memory-search-snippet-sufficient"
kind = "capability"
trials = 3
task = "What platform is our staging environment deployed on? Answer in one sentence."

# Calibration pair with search-then-read-when-needed (same fixtures): the
# answer sits on the very line memory_search's snippet renders, so reading
# the note in full is pure waste. This is the cost-discipline half of the
# pair — the model must NOT follow up with memory_read.
expect = [
  "tool_called memory_search",
  "tool_not_called memory_read",
  "final_contains fly.io",
]
max_total_tokens = 120000
timeout_secs = 240

[seed.memory]
notes = [
  { name = "deploy-strategy", file = "_fixtures/deploy-strategy.md" },
  { name = "ops-runbook",     file = "_fixtures/ops-runbook.md" },
]
