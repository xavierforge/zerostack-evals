id = "session-tool-call-recorded"
kind = "regression"
trials = 3
task = "What is the launch code recorded in notes.txt?"

# Evidence-channel regression pin (design D6, section 10): reading notes.txt
# forces some tool call, so `tool_called_any` passing here is proof, after
# section 1's switch to session `tool` records, that a headless run's session
# JSON actually carries tool records rather than an empty list. Deliberately
# name-agnostic: a first version pinned `tool_called read`, but the model is
# free to answer with `bash cat notes.txt` instead of the `read` tool, which
# made the assert a claim about model habit rather than about the evidence
# channel. `final_contains` is what still says the job got done. This is the
# same claim the coverage ledger's tool-use area records against issue #229.
expect = [
  "tool_called_any",
  "final_contains 4821",
]

[[files]]
src = "_fixtures/notes.txt"
dest = "work:notes.txt"
