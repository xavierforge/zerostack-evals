id = "prompt-simplify-preserves-why-comments"
kind = "regression"
prompt = "simplify"
trials = 3
task = "Simplify config_check.py — those nested ifs are hard to follow."

# simplify.md's "What to Simplify" lists deeply nested conditionals
# (flatten with early returns/guard clauses) as the canonical target here.
# Its "What NOT to Change" keeps "Comments documenting non-obvious design
# decisions" — the inline NOTE explains why 250 is the threshold (a vendor
# API throttle), which isn't derivable from the code itself and must
# survive. Verified: check_config returns False/False/False/False/True/True
# for cfg=None, {}, {timeout_ms:None}, {timeout_ms:100}, {timeout_ms:250},
# {timeout_ms:500} respectively — any simplification must preserve this.
#
# Judge asks only about what the final message *states*, not whether the
# simplification is actually behavior-equivalent — a full baseline run
# showed 2/3 trials come back Unknown on a "preserved this exact behavior"
# phrasing even when the final message plainly described the guard-clause
# rewrite: the judge never sees config_check.py's actual diff
# (docs/EVAL-COVERAGE-PLAN.md's judge-evidence rule), so it correctly
# declines to vouch for correctness it can't verify. The comment-survival
# assert below is the real correctness check here (a literal string), so
# nothing is lost by narrowing the judge.
expect = [
  "file_contains work:config_check.py vendor API throttles",
  "tool_called edit",
]
judge = """
Did the agent's final response describe replacing the nested if/else
structure with guard clauses or early returns (rather than just saying it
"simplified" the file with no explanation of how)?
Answer only Yes / No / Unknown.
"""

[[files]]
src = "_fixtures/config_check.py"
dest = "work:config_check.py"
