id = "prompt-refactor-preserves-tests"
prompt = "refactor"
trials = 3
task = "Refactor calc.py to remove the duplicated argument-validation logic between add() and multiply()."

# refactor.md's Core Principle: "Never change what the code does — only how
# it is organized. Every refactor must be behavior-preserving." add() and
# multiply() each repeat the same two isinstance checks — an obvious extract
# target. test_calc.py's assertions (including the TypeError case) must
# still hold after the refactor; refactor.md also says "Existing test
# assertions — tests are the safety net" under What NOT to Change.
#
# Judge asks only about what the final message *states*, not whether the
# refactor is actually correct — a full baseline run showed 2/3 trials come
# back Unknown on a "did it preserve exact behavior" phrasing even when the
# final message plainly described extracting a shared helper: the judge
# never sees calc.py's actual diff (docs/EVAL-COVERAGE-PLAN.md's
# judge-evidence rule), so it correctly refuses to vouch for code
# correctness it can't verify — that's the judge being appropriately
# careful, not a rubric bug. Actual correctness is covered by the
# deterministic asserts below (tests survive unmodified) plus tool_called
# edit as evidence something happened.
expect = [
  "file_contains work:test_calc.py assert add(2, 2) == 4",
  "file_contains work:test_calc.py assert multiply(3, 4) == 12",
  "tool_called edit",
]
judge = """
Did the agent's final response describe extracting the duplicated
validation logic into a shared helper (rather than just saying it
"refactored" the file with no explanation of how)?
Answer only Yes / No / Unknown.
"""

[[files]]
src = "_fixtures/calc.py"
dest = "work:calc.py"

[[files]]
src = "_fixtures/test_calc.py"
dest = "work:test_calc.py"
