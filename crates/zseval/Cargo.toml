[package]
name = "zseval"
version = "0.1.0"
edition = "2021"
description = "Eval harness for zerostack agents: TOML scenarios, deterministic asserts, LLM judge, three-value verdicts."
license = "MIT"

[dependencies]
anyhow = "=1.0.95"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.133"
toml = "=0.8.19"

[[bin]]
name = "zseval"
path = "src/main.rs"
