[package]
name = "zseval"
version = "0.1.0"
edition = "2021"
description = "Eval harness for zerostack agents: TOML scenarios, deterministic asserts, LLM judge, three-value verdicts."
license = "MIT"

[dependencies]
anyhow = "=1.0.95"
rig-core = "=0.40.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.4", features = ["rt", "rt-multi-thread", "time"] }
toml = "=0.8.19"

[[bin]]
name = "zseval"
path = "src/main.rs"
