name: evals
on:
  pull_request:
  schedule:
    - cron: "0 18 * * *"   # nightly

jobs:
  # Always: harness plumbing (parse -> assert -> verdict -> report), zero API
  # cost, seconds. This gate must stay green on every commit.
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # Prompt eval + regression gate. Enable once a baseline is committed
  # (baselines/main.json) and an ANTHROPIC_API_KEY secret is set — see README
  # "Iterating on prompts". Kept correct-but-dormant so the repo stays green
  # from the first commit; uncomment when the suite is solid.
