id = "prompt-pack-example-marker"
kind = "regression"
prompt = "code"
trials = 1

# Trivial, tool-free task: the only thing under test is whether the pack's
# code.md (../pack/code.md) beat zerostack's built-in `code` prompt, not
# coding ability. trials = 1 to keep the one live run (tasks.md section 12)
# cheap — this scenario is never part of the default suite, so it does not
# need the usual N=3 signal.
task = "Reply with a one-sentence greeting. No files or tools are needed."

# The grade is the session's own record of which prompt served the run:
# `code`, resolved from a user file, which under this invocation can only be
# the pack's ../pack/code.md seeded into `.zerostack/prompts/` (a built-in
# `code` records `built_in` instead). Nothing rides on the model repeating a
# marker string any more, so a disobedient model can no longer read as a
# pack that never loaded. See ../README.md for what a failure here means.
expect = [
  "prompt_recorded code user_file",
]
